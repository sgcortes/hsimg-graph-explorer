name: Deploy HSIMG Graph Explorer to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install the matching SQL.js runtime
        run: cp node_modules/sql.js/dist/sql-wasm.wasm public/sql-wasm.wasm
      - name: Check application types and bundled graph
        run: |
          pnpm exec tsc -p tsconfig.app.json --noEmit
          pnpm test:graph
          pnpm test:validation
      - name: Build static site
        run: pnpm build:github
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-github
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
